spring.application.name=bluefood-api
spring.datasource.url=jdbc:mysql://localhost/bluefood?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.open-in-view=true

#spring.jpa.generate-ddl=true
#spring.jpa.hibernate.ddl-auto=update


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.jpa.show-sql=true

spring.flyway.locations=classpath:db/migration,classpath:db/testdata

#spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=src/main/resources/ddl.sql

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=10000

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

spring.mvc.throw-exception-if-no-handler-found=true
spring.resources.add-mappings=false

bluefood.storage.tipo-storage=local

bluefood.storage.local.diretorio-fotos=/home/guilherme/catalogo

bluefood.storage.s3.bucket=bluefood-fotos
bluefood.storage.s3.regiao=us-east-1
bluefood.storage.s3.diretorio-fotos=catalogo

spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.freemarker.settings.locale=pt_BR

bluefood.email.remetente=Bluefood <onboarding@resend.dev>

blufood.email.impl=sandbox

bluefood.email.sandbox.destinatarios=guilherme.1009.ga@gmail.com




